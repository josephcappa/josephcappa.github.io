<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A flower for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#7a3350; --pink:#ff6a97; }
  * { box-sizing:border-box; margin:0; }
  body {
    font-family:"Quicksand",system-ui,sans-serif; color:var(--ink);
    min-height:100vh; padding:24px; overflow-x:hidden; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.9) 0, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(255,214,230,.9) 0, transparent 40%),
      linear-gradient(180deg,#ffd9e6 0%,#ffeee3 60%,#e9f7df 100%);
  }
  .bokeh { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .bokeh i { position:absolute; border-radius:50%; background:rgba(255,255,255,.55); animation:drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate(14px,-22px); opacity:.35; } }
  main { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
  h1 { font-family:"Caveat",cursive; font-weight:700; font-size:clamp(2.6rem,9vw,4rem); text-align:center; line-height:1.05;
       text-shadow:0 2px 0 #fff, 0 6px 18px rgba(255,106,151,.25); }
  .sub { text-align:center; font-weight:600; opacity:.8; margin:4px 0 6px; }
  svg { width:min(90vw,420px); height:auto; overflow:visible; filter:drop-shadow(0 18px 22px rgba(190,70,110,.22)); }
  .sway { transform-origin:200px 530px; animation:sway 6s ease-in-out infinite; }
  .sway2 { transform-origin:90px 540px; animation:sway 5s ease-in-out infinite reverse; }
  .sway3 { transform-origin:315px 540px; animation:sway 5.5s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2.2deg)} }
  .bloom { transform-origin:200px 190px; animation:bloom 1.8s cubic-bezier(.2,1.25,.4,1) both; }
  @keyframes bloom { from{transform:scale(.05) rotate(-50deg);opacity:0} to{transform:none;opacity:1} }
  .glow { transform-origin:200px 190px; animation:pulse 3.5s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); opacity:.7; } }
  .sparkle { transform-box:fill-box; transform-origin:center; animation:tw 2.6s ease-in-out infinite; }
  @keyframes tw { 0%,100%{transform:scale(0);opacity:0} 50%{transform:scale(1);opacity:1} }
  .heart { animation:float 5s ease-in infinite; opacity:0; }
  @keyframes float { 0%{transform:translateY(0);opacity:0} 20%{opacity:.9} 100%{transform:translateY(-100px);opacity:0} }
  .blink { transform-box:fill-box; transform-origin:center; animation:blink 5s infinite; }
  @keyframes blink { 0%,94%,100%{transform:scaleY(1)} 97%{transform:scaleY(.1)} }
  button { font:inherit; font-weight:600; color:#fff; border:0; border-radius:999px; padding:13px 30px; cursor:pointer; margin-top:6px;
           background:linear-gradient(135deg,#ff8fb1,#ff5a8a); box-shadow:0 8px 20px rgba(255,90,138,.4); transition:transform .15s; }
  button:hover { transform:translateY(-2px) scale(1.03); }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  #note { font-family:"Caveat",cursive; font-size:1.8rem; text-align:center; min-height:2.4rem; margin-top:12px; max-width:22ch; }
  .fall { position:fixed; top:-30px; z-index:2; pointer-events:none; width:14px; height:18px;
          border-radius:100% 0 100% 0; background:linear-gradient(135deg,#ffc2d6,#ff8fb1); animation:fall linear forwards; }
  @keyframes fall { to { transform:translate(var(--dx),110vh) rotate(var(--rot)); opacity:.6; } }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} .heart,.sparkle{opacity:0} }
</style>
</head>
<body>
  <div class="bokeh" aria-hidden="true">
    <i style="left:8%;top:20%;width:60px;height:60px"></i><i style="left:80%;top:12%;width:90px;height:90px;animation-delay:2s"></i>
    <i style="left:15%;top:70%;width:80px;height:80px;animation-delay:1s"></i><i style="left:88%;top:62%;width:50px;height:50px;animation-delay:3s"></i>
    <i style="left:50%;top:6%;width:40px;height:40px;animation-delay:4s"></i>
  </div>

  <main>
    <h1>For you, my love</h1>
    <p class="sub">a little flower that never wilts 🌷</p>

    <svg viewBox="0 0 400 570" role="img" aria-label="A cute pink flower with a smiling face, surrounded by sparkles">
      <defs>
        <linearGradient id="pet" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff5a8a"/><stop offset=".55" stop-color="#ff8fb1"/><stop offset="1" stop-color="#ffd3e1"/>
        </linearGradient>
        <linearGradient id="pet2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff7aa3"/><stop offset="1" stop-color="#ffe3ec"/>
        </linearGradient>
        <radialGradient id="ctr" cx=".4" cy=".35" r=".8">
          <stop offset="0" stop-color="#fff0a8"/><stop offset=".6" stop-color="#ffc83d"/><stop offset="1" stop-color="#f29a1f"/>
        </radialGradient>
        <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ffd0e0" stop-opacity="0"/></radialGradient>
        <linearGradient id="stem" x1="0" x2="1"><stop offset="0" stop-color="#3f9654"/><stop offset="1" stop-color="#78cf84"/></linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd48a"/><stop offset="1" stop-color="#3f9654"/></linearGradient>
        <path id="p1" d="M200 190C148 135 152 55 200 38C248 55 252 135 200 190Z"/>
        <path id="p2" d="M200 190C165 150 168 92 200 80C232 92 235 150 200 190Z"/>
        <g id="bud">
          <path d="M0 0C-26-18-24-58 0-78C24-58 26-18 0 0Z" fill="url(#pet)"/>
          <path d="M0 0C-10-22-8-50 0-66C8-50 10-22 0 0Z" fill="#ffd3e1" opacity=".7"/>
        </g>
      </defs>

      <!-- halo + ground -->
      <circle class="glow" cx="200" cy="190" r="170" fill="url(#halo)"/>
      <ellipse cx="200" cy="548" rx="150" ry="16" fill="#bfe3b6" opacity=".8"/>

      <!-- grass -->
      <g fill="#6cc27a" opacity=".9">
        <path d="M60 552Q64 520 72 505Q74 528 80 552Z"/><path d="M80 552Q88 525 104 512Q98 532 98 552Z"/>
        <path d="M300 552Q302 522 312 508Q316 530 322 552Z"/><path d="M322 552Q332 530 346 520Q340 536 340 552Z"/>
        <path d="M150 552Q154 535 162 528Q162 542 166 552Z"/><path d="M240 552Q246 534 256 526Q254 542 256 552Z"/>
      </g>

      <!-- small side flowers -->
      <g class="sway2">
        <path d="M90 545C88 500 92 460 90 430" stroke="url(#stem)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="translate(90 430)"><use href="#bud" transform="rotate(-35)"/><use href="#bud" transform="rotate(35)"/><use href="#bud"/></g>
      </g>
      <g class="sway3">
        <path d="M315 545C318 505 312 475 316 450" stroke="url(#stem)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="translate(316 450) scale(.85)"><use href="#bud" transform="rotate(-35)"/><use href="#bud" transform="rotate(35)"/><use href="#bud"/></g>
      </g>

      <g class="sway">
        <!-- stem + leaves -->
        <path d="M200 260C188 350 216 440 200 545" stroke="url(#stem)" stroke-width="13" fill="none" stroke-linecap="round"/>
        <path d="M204 440C275 405 318 425 330 380C275 360 218 390 204 440Z" fill="url(#leaf)"/>
        <path d="M204 440C255 412 292 408 320 388" stroke="#3f9654" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
        <path d="M197 485C125 450 82 475 70 430C125 410 185 440 197 485Z" fill="url(#leaf)"/>
        <path d="M197 485C148 455 112 452 82 435" stroke="#3f9654" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
        <!-- dewdrop -->
        <ellipse cx="290" cy="410" rx="5" ry="7" fill="#fff" opacity=".85"/>

        <!-- flower head -->
        <g class="bloom">
          <g fill="url(#pet)" stroke="#ff6a97" stroke-width="2" stroke-linejoin="round">
            <use href="#p1"/><use href="#p1" transform="rotate(45 200 190)"/><use href="#p1" transform="rotate(90 200 190)"/><use href="#p1" transform="rotate(135 200 190)"/>
            <use href="#p1" transform="rotate(180 200 190)"/><use href="#p1" transform="rotate(225 200 190)"/><use href="#p1" transform="rotate(270 200 190)"/><use href="#p1" transform="rotate(315 200 190)"/>
          </g>
          <g fill="url(#pet2)" opacity=".95">
            <use href="#p2" transform="rotate(22 200 190)"/><use href="#p2" transform="rotate(67 200 190)"/><use href="#p2" transform="rotate(112 200 190)"/><use href="#p2" transform="rotate(157 200 190)"/>
            <use href="#p2" transform="rotate(202 200 190)"/><use href="#p2" transform="rotate(247 200 190)"/><use href="#p2" transform="rotate(292 200 190)"/><use href="#p2" transform="rotate(337 200 190)"/>
          </g>
          <circle cx="200" cy="190" r="58" fill="url(#ctr)" stroke="#f29a1f" stroke-width="3"/>
          <g fill="#f29a1f" opacity=".35">
            <circle cx="170" cy="160" r="2.5"/><circle cx="195" cy="150" r="2.5"/><circle cx="225" cy="155" r="2.5"/><circle cx="240" cy="175" r="2.5"/>
            <circle cx="160" cy="185" r="2.5"/><circle cx="238" cy="215" r="2.5"/><circle cx="165" cy="215" r="2.5"/>
          </g>
          <!-- face -->
          <g class="blink"><circle cx="178" cy="184" r="6.5" fill="#5a2a3a"/><circle cx="222" cy="184" r="6.5" fill="#5a2a3a"/></g>
          <circle cx="180.5" cy="181.5" r="2.3" fill="#fff"/><circle cx="224.5" cy="181.5" r="2.3" fill="#fff"/>
          <ellipse cx="160" cy="202" rx="10" ry="6.5" fill="#ff8fb1" opacity=".7"/>
          <ellipse cx="240" cy="202" rx="10" ry="6.5" fill="#ff8fb1" opacity=".7"/>
          <path d="M185 205Q200 222 215 205" stroke="#5a2a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
      </g>

      <!-- sparkles -->
      <g fill="#fff" stroke="#ffc83d" stroke-width="1.5">
        <path class="sparkle" style="animation-delay:.2s" d="M50 130l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
        <path class="sparkle" style="animation-delay:1.2s" d="M350 90l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path class="sparkle" style="animation-delay:2s" d="M345 250l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path class="sparkle" style="animation-delay:.7s" d="M70 300l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      </g>

      <!-- hearts -->
      <path class="heart" d="M60 230c-8-12 8-22 14-10 6-12 22-2 14 10l-14 14z" fill="#ff6a97"/>
      <path class="heart" style="animation-delay:1.7s" d="M320 210c-8-12 8-22 14-10 6-12 22-2 14 10l-14 14z" fill="#ffa3c0"/>
      <path class="heart" style="animation-delay:3.2s" d="M285 130c-6-9 6-16 10-8 4-8 16-1 10 8l-10 10z" fill="#ff6a97"/>
    </svg>

    <button id="btn" type="button">little note for my sweet Lorynor</button>
    <p id="note" aria-live="polite"></p>
  </main>

  <script>
    var notes = ["You're my favorite person.","Thinking of you, always.","You make my world brighter.","I love you more every day.","Smile, you're beautiful."];
    var n = 0;
    function petal() {
      var p = document.createElement("div");
      p.className = "fall";
      p.style.left = Math.random() * 100 + "vw";
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      p.style.animationDuration = (7 + Math.random() * 6) + "s";
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 14000);
    }
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!calm) setInterval(petal, 1400);
    document.getElementById("btn").addEventListener("click", function () {
      document.getElementById("note").textContent = notes[n % notes.length] + " ♥";
      n++;
      if (!calm) for (var k = 0; k < 12; k++) setTimeout(petal, k * 90);
    });
  </script>
</body>
</html>
